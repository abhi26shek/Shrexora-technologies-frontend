  useEffect(() => {

    let frameId;
    let start = performance.now();
    const animate = (now) => {
      const elapsed = (now - start) / 1000;
      // Smoothly oscillate between showing the front OLED screen, the 3D titanium rails, and a full 360 spin every 14s
      const cycle = elapsed % 14;
      let targetY;
      if (cycle < 9) {
        // Gentle floating 3D showcase angle (-28deg to +28deg)
        targetY = Math.sin((cycle / 9) * Math.PI * 2) * 28;
      } else {
        // Full 360° 3D spin showing the back triple-camera & Shrexora back emblem!
        const spinProgress = (cycle - 9) / 5;
        targetY = Math.sin(spinProgress * Math.PI * 2) * 180;
      }
      const targetX = -7 + Math.cos(elapsed * 1.3) * 6;
      const targetZ = Math.sin(elapsed * 0.9) * 3.5;
      setHeroRot({ x: targetX, y: targetY, z: targetZ });
      frameId = requestAnimationFrame(animate);

    frameId = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frameId);

  useEffect(() => {

      setScrollProgress(pct);

      if (y < 520) setScrollStage(0);

      else if (y < 2350) setScrollStage(2);
      else if (y < 3250) setScrollStage(3);

              alt="Shrexora Logo"
              className="h-10 w-10 rounded-xl border border-blue-500/30 bg-slate-950 object-cover p-0 shadow-md"
            />
            <div>
              <p className="text-sm font-black text-slate-950">Shrexora Technologies</p>
              <p className="text-xs font-medium text-slate-500">
                Founded by Abhishek Kaushik (+91 8077XXXXXX) &amp; 4 Co-Founders • Delhi NCR
              </p>
            </div>
          </div>

          <div className="flex flex-wrap gap-5 text-xs font-bold text-slate-600">
            <button onClick={() => scrollToSection('creative-showcase')} className="hover:text-blue-600">
              What We Do
            </button>
            <button onClick={() => scrollToSection('pick-pack')} className="hover:text-blue-600">
              Tech Packs
            </button>
            <button onClick={() => scrollToSection('services')} className="hover:text-blue-600">
              Our Services
            </button>
            <button onClick={() => scrollToSection('courses-internships')} className="hover:text-blue-600">
              Courses &amp; Internships
            </button>
            <button onClick={() => scrollToSection('hackathons')} className="hover:text-blue-600">
              Student Hackathons
            </button>
            <button onClick={() => scrollToSection('calculator')} className="hover:text-blue-600">
              Cost Calculator
            </button>
            <button onClick={() => scrollToSection('contact')} className="hover:text-blue-600">
              Contact Abhishek
            </button>
          </div>
        </div>
      </footer>

      {/* ====================================================================
          UPGRADED FLOATING SHREX-BOT 2.0 AI ASSISTANT WIDGET
          (3 Modes: AI Chat, 60s Scope Wizard, & Instant Callback Capture)
      ==================================================================== */}
      <div className="fixed bottom-5 right-5 z-50 flex flex-col items-end max-w-[calc(100vw-2rem)]">
        {/* Proactive Welcome Prompt Bubble when closed */}
        {!chatOpen && showChatTeaser && (
          <div className="mb-2.5 flex items-center gap-2.5 rounded-2xl border border-blue-200 bg-white px-4 py-2.5 shadow-xl">
            <span className="h-2.5 w-2.5 animate-ping rounded-full bg-emerald-500" />
            <button
              onClick={() => setChatOpen(true)}
              className="text-left text-xs font-extrabold text-slate-800 hover:text-blue-600"
            >
              👋 Need a Website/App Quote? Ask <span className="text-blue-600">Shrex-AI!</span>
            </button>
            <button
              onClick={() => setShowChatTeaser(false)}
              className="text-slate-400 hover:text-slate-700"
              aria-label="Dismiss AI Teaser"
            >
              <X className="h-3.5 w-3.5" />
            </button>
          </div>
        )}

        {chatOpen ? (
          <div className="w-[calc(100vw-2.5rem)] max-w-[385px] overflow-hidden rounded-[28px] border border-slate-200 bg-white shadow-[0_25px_70px_rgba(15,23,42,0.28)]">
            {/* Top Header */}
            <div className="bg-slate-950 px-4 pt-3.5 pb-2.5 text-white">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600">
                    <Bot className="h-5 w-5 text-white" />
                    <span className="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border border-slate-950 bg-emerald-400" />
                  </div>
                  <div>
                    <p className="text-xs font-black">SHREX-BOT 2.0 • AI Concierge</p>
                    <p className="text-[10px] text-slate-300">Hinglish + English • Instant Quotes</p>
                  </div>
                </div>
                <button
                  onClick={() => setChatOpen(false)}
                  className="rounded-lg p-1 text-slate-400 hover:bg-white/10 hover:text-white"
                >
                  <X className="h-4 w-4" />
                </button>
              </div>

              {/* 3 Mode Switcher Tabs inside Floating Bot */}
              <div className="mt-3 grid grid-cols-3 gap-1 rounded-xl bg-white/10 p-1 text-[10px] font-extrabold">
                <button
                  onClick={() => setChatTab('chat')}
                  className={`rounded-lg py-1.5 transition ${
                    chatTab === 'chat' ? 'bg-white text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  💬 AI Chat
                </button>
                <button
                  onClick={() => setChatTab('wizard')}
                  className={`rounded-lg py-1.5 transition ${
                    chatTab === 'wizard' ? 'bg-white text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  🧭 AI Roadmap
                </button>
                <button
                  onClick={() => setChatTab('callback')}
                  className={`rounded-lg py-1.5 transition ${
                    chatTab === 'callback' ? 'bg-white text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  📞 Instant Call
                </button>
              </div>
            </div>

            {/* TAB 1: CONVERSATIONAL AI CHAT */}
            {chatTab === 'chat' && (
              <>
                <div className="max-h-72 space-y-2.5 overflow-y-auto bg-slate-50/60 p-3.5">
                  {chatMessages.map((m, idx) => (
                    <div
                      key={idx}
                      className={`rounded-2xl p-3 text-xs font-medium leading-relaxed ${
                        m.sender === 'user'
                          ? 'ml-6 bg-blue-600 text-white'
                          : 'mr-3 border border-slate-200 bg-white text-slate-800 shadow-sm'
                      }`}
                    >
                      <p>{m.text}</p>
                      {m.actionId && (
                        <button
                          onClick={() => handleBotActionClick(m.actionId)}
                          className="mt-2 inline-flex items-center gap-1 rounded-lg bg-blue-50 px-2.5 py-1 text-[10px] font-extrabold text-blue-700 hover:bg-blue-600 hover:text-white"
                        >
                          <span>{m.actionLabel}</span>
                          <ArrowRight className="h-3 w-3" />
                        </button>
                      )}
                    </div>
                  ))}
                  {isBotTyping && (
                    <div className="text-[11px] font-bold text-slate-500 px-2">
                      Shrex-AI is typing...
                    </div>
                  )}
                </div>

                <div className="flex flex-wrap gap-1.5 border-t border-slate-100 bg-white px-3 pt-2">
                  {['Pack Prices?', 'Mobile App Cost?', 'Live Sample Demo', 'Contact Abhishek'].map((q) => (
                    <button
                      key={q}
                      onClick={() => handleChatSend(q)}
                      className="rounded-full border border-slate-200 bg-slate-50 px-2.5 py-1 text-[10px] font-bold text-slate-700 hover:border-blue-400 hover:text-blue-600"
                    >
                      {q}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-2 bg-white p-3">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleChatSend()}
                    placeholder="Ask Shrex-Bot in Hinglish or English..."
                    className="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-900 focus:border-blue-600 focus:outline-none"
                  />
                  <button
                    onClick={() => handleChatSend()}
                    className="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-600 text-white hover:bg-blue-700"
                  >
                    <Send className="h-3.5 w-3.5" />
                  </button>
                </div>
              </>
            )}

            {/* TAB 2: AI SCOPE & PRICE BLUEPRINT WIZARD INSIDE CHATBOT */}
            {chatTab === 'wizard' && (
              <div className="space-y-3 p-4">
                <p className="text-xs font-black text-slate-950">
                  Select Your Goal for an Instant AI Spec:
                </p>
                <div className="grid grid-cols-1 gap-1.5">
                  {AI_WIZARD_GOALS.map((g) => (
                    <button
                      key={g.id}
                      onClick={() => setWizardGoal(g.id)}
                      className={`flex items-center justify-between rounded-xl border px-3 py-2 text-left text-xs font-bold ${
                        wizardGoal === g.id
                          ? 'border-blue-600 bg-blue-50 text-blue-950'
                          : 'border-slate-200 bg-white text-slate-700'
                      }`}
                    >
                      <span>{g.label}</span>
                      <span className="font-black text-blue-600">
                        ₹{g.base.toLocaleString('en-IN')}
                      </span>
                    </button>
                  ))}
                </div>
                {(() => {
                  const g = AI_WIZARD_GOALS.find((x) => x.id === wizardGoal) || AI_WIZARD_GOALS[0];
                  return (
                    <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 text-xs">
                      <p className="font-black text-slate-900">Recommended Stack:</p>
                      <p className="mt-0.5 text-[11px] font-semibold text-slate-600">{g.stack}</p>
                      <p className="mt-1 text-[11px] font-extrabold text-emerald-700">
                        Timeline: {g.weeks} • 100% Code Ownership
                      </p>
                    </div>
                  );
                })()}
                <button
                  onClick={() => {
                    const g = AI_WIZARD_GOALS.find((x) => x.id === wizardGoal) || AI_WIZARD_GOALS[0];
                    setChatOpen(false);
                    prefillQuoteAndScroll(
                      g.label,
                      `Approx ₹${g.base.toLocaleString('en-IN')}`,
                      `Hi Abhishek, I selected "${g.label}" (${g.stack}) in the Shrex-AI Wizard.`
                    );
                  }}
                  className="w-full rounded-xl bg-blue-600 py-2.5 text-xs font-extrabold text-white"
                >
                  Lock This AI Blueprint →
                </button>
              </div>
            )}

            {/* TAB 3: INSTANT CALLBACK CAPTURE INSIDE CHATBOT */}
            {chatTab === 'callback' && (
              <div className="p-4">
                {botLeadSubmitted ? (
                  <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-center">
                    <p className="text-sm font-black text-emerald-950">Callback Logged! 🎉</p>
                    <p className="mt-1 text-xs font-medium text-emerald-800">
                      Co-Founder Abhishek Kaushik (+91 8077XXXXXX) will call/WhatsApp {botLeadPhone} shortly.
                    </p>
                    <button
                      onClick={() => setBotLeadSubmitted(false)}
                      className="mt-3 rounded-xl bg-emerald-700 px-4 py-1.5 text-[11px] font-extrabold text-white"
                    >
                      Done
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleBotQuickLeadSubmit} className="space-y-3">
                    <p className="text-xs font-black text-slate-950">
                      Get a Call from Co-Founder Abhishek Kaushik in 2 Hours:
                    </p>
                    <input
                      type="text"
                      required
                      value={botLeadName}
                      onChange={(e) => setBotLeadName(e.target.value)}
                      placeholder="Your Name *"
                      className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900"
                    />
                    <input
                      type="tel"
                      required
                      value={botLeadPhone}
                      onChange={(e) => setBotLeadPhone(e.target.value)}
                      placeholder="Phone / WhatsApp Number *"
                      className="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-900"
                    />
                    <button
                      type="submit"
                      className="w-full rounded-xl bg-slate-950 py-2.5 text-xs font-extrabold text-white hover:bg-blue-600"
                    >
                      Request Instant Callback →
                    </button>
                  </form>
                )}
              </div>
            )}
          </div>
        ) : (
          <button
            onClick={() => setChatOpen(true)}
            className="inline-flex items-center gap-2 rounded-full bg-slate-950 px-5 py-3.5 text-xs font-extrabold text-white shadow-2xl ring-2 ring-blue-500/40 transition hover:scale-105 hover:bg-blue-600"
          >
            <Bot className="h-4 w-4 text-blue-400" />
            <span>🤖 SHREX-BOT</span>
          </button>
        )}
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ShrexoraTechnologiesApp />);
  </script>
</body>
</html>
